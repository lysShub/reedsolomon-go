name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: go mod tidy
      - run: staticcheck ./...
      - run: staticcheck -tags debug ./...
      - run: goimports -w .
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go fmt ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: git diff --exit-code
