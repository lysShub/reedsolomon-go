name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/goimports@v0.24.0
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.4.7
      - run: go mod tidy
      - run: staticcheck ./...
      - run: staticcheck -tags debug ./...
      - run: goimports -w .
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go fmt ./...
      - run: git diff --exit-code

  test:
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go test ./...
      - run: go test -tags debug ./...

  checks-done:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.lint.result }}" = success
      - run: test "${{ needs.test.result }}" = success