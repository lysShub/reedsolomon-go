name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go fmt ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: git diff --exit-code

  bench:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: checkout base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base

      - name: bench base (master)
        working-directory: base
        run: go test -run='^$' -bench=Benchmark -benchmem -count=1 -benchtime=3s ./encodec/ ./galois/ | tee base.txt

      - name: bench head (PR)
        run: go test -run='^$' -bench=Benchmark -benchmem -count=1 -benchtime=3s ./encodec/ ./galois/ | tee head.txt

      - name: compare & gate
        run: |
          cd .github/benchdiff
          go run . "$GITHUB_WORKSPACE/base/base.txt" "$GITHUB_WORKSPACE/head.txt" | tee "$GITHUB_WORKSPACE/result.txt"

      - name: post summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/result.txt" | tee "$GITHUB_STEP_SUMMARY"

  checks-done:
    needs: [test, bench]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.bench.result }}" = success
